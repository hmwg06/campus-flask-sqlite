{% extends 'base.html' %}
{% from 'macros.html' import heading,csrf with context %}
{% block content %}
    {{ heading('TÀI KHOẢN CÁ NHÂN','Đổi mật khẩu','Sử dụng mật khẩu riêng, có ít nhất 8 ký tự.') }}
    <section class="panel form-panel">
        <form method="post">
            {{ csrf() }}
            <label>
                Mật khẩu hiện tại
                <input type="password" name="old_password" required maxlength="256" autocomplete="current-password">
            </label>
            <label>
                Mật khẩu mới
                <input type="password" name="password" minlength="8" maxlength="256" required autocomplete="new-password">
            </label>
            <label>
                Nhập lại mật khẩu mới
                <input type="password" name="confirm_password" minlength="8" maxlength="256" required autocomplete="new-password">
            </label>
            <div class="form-actions">
                <button class="btn primary">Đổi mật khẩu</button>
            </div>
        </form>
    </section>
{% endblock %}
